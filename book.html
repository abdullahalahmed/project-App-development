<section>


<div class="booking-container">

  <h2>🚆 Book Your Train Ticket</h2>

  <!-- Trip Type -->
  <div class="trip-type">
    <label><input type="radio" name="trip" checked> One Way</label>
    <label><input type="radio" name="trip"> Round Trip</label>
    <label><input type="radio" name="trip"> Multi Route</label>
  </div>

  <!-- Booking Form -->
  <div class="booking-form">

    <div class="form-group">
	<label>From:</label>
	<select required>
	<option value="">Select City</option>
	<option>Riyadh</option>
	<option>Jeddah</option>
	<option>Dammam</option>
	</select>
    </div>

    <div class="form-group">
	<label>To:</label>
	<select required>
	<option value="">Select Destination</option>
	<option>Makkah</option>
	<option>Madinah</option>
	<option>Dammam</option>
	</select>
    </div>

    <div class="form-group">
      <label>Departure Date</label>
      <input type="date">
    </div>

    <div class="form-group">
      <label>Travelers</label>
      <select>
        <option>1 Traveler</option>
        <option>2 Travelers</option>
        <option>3 Travelers</option>
      </select>
    </div>

  </div>

  <!-- Extra Option -->
  <div class="extra">
    <label><input type="checkbox"> Group Booking (10+ passengers)</label>
  </div>

  <!-- Button -->
  <button class="search-btn">🔍 Search Trains</button>

</div>


</section>
